<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adexium Interstitial Demo</title>

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111827;
    font-family:Arial,sans-serif;
}
#startBtn{
    padding:16px 40px;
    border:none;
    border-radius:10px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>

<button id="startBtn">START</button>

<script>
document.addEventListener("DOMContentLoaded", function () {

    if (typeof AdexiumWidget === "undefined") {
        alert("Adexium SDK failed to load");
        return;
    }

    const adexiumWidget = new AdexiumWidget({
        wid: "2aafd995-61f3-4051-92cf-948579c692dc",
        adFormat: "interstitial"
    });

    document.getElementById("startBtn").addEventListener("click", async () => {

        try {

            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            adexiumWidget.autoMode();

            console.log("Ad requested");

        } catch (err) {
            console.error("Ad Error:", err);
            alert("Ad Error: " + err.message);
        }

    });

});
</script>

</body>
</html>
