<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js?56"></script>

<script src="https://cdn.tgads.space/assets/js/adexium-widget.min.js"></script>

<title>Earn Viu</title>
</head>
<body>

<h2>Earn Viu</h2>

<button id="startBtn">Start</button>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const adexiumWidget = new AdexiumWidget({
        wid: "2aafd995-61f3-4051-92cf-948579c692dc",
        adFormat: "interstitial"
    });

    document.getElementById("startBtn").addEventListener("click", () => {
        try {

            if (typeof adexiumWidget.showAd === "function") {
                adexiumWidget.showAd();
            } else if (typeof adexiumWidget.show === "function") {
                adexiumWidget.show();
            } else {
                console.log("Ad show method not found");
            }

        } catch (e) {
            console.error(e);
        }
    });

});
</script>

</body>
</html>
