<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#080b14;
    --card:rgba(255,255,255,.045);
    --stroke:rgba(255,255,255,.09);
    --txt:#eef2ff;
    --muted:#8b93ab;
    --accent1:#7c5cff;
    --accent2:#22d3ee;
    --ok:#22c55e;
  }
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--txt);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 12% 0%, rgba(124,92,255,.32), transparent 70%),
      radial-gradient(50% 38% at 92% 8%, rgba(34,211,238,.18), transparent 70%),
      radial-gradient(70% 45% at 50% 112%, rgba(124,92,255,.20), transparent 70%);
  }
  .app{
    position:relative;z-index:1;
    max-width:520px;margin:0 auto;
    padding:0 16px 40px;
  }

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;gap:13px;padding:22px 2px 16px}
  .logo{
    width:50px;height:50px;flex:0 0 50px;border-radius:16px;
    display:grid;place-items:center;font-size:25px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 10px 26px rgba(124,92,255,.48);
    animation:logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse{
    0%,100%{box-shadow:0 10px 26px rgba(124,92,255,.42)}
    50%{box-shadow:0 10px 34px rgba(34,211,238,.55)}
  }
  .topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px;font-family:'Sora',sans-serif}
  .topbar p{margin:4px 0 0;font-size:12px;color:var(--muted);font-weight:500}

  /* ---------- Overall progress ---------- */
  .progress-card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,rgba(124,92,255,.20),rgba(34,211,238,.07));
    border:1px solid rgba(255,255,255,.11);
    border-radius:20px;
    padding:16px 16px 15px;
    margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.40);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  .progress-card::after{
    content:'';position:absolute;top:0;left:-60%;width:55%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    animation:sheen 4.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes sheen{0%{left:-60%}55%{left:130%}100%{left:130%}}
  .p-row{display:flex;align-items:center;gap:14px;margin-bottom:11px}
  .p-ring{position:relative;width:44px;height:44px;flex:0 0 44px}
  .p-ring svg{width:44px;height:44px;transform:rotate(-90deg)}
  .ring-track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:4}
  .ring-fill{
    fill:none;stroke:url(#ringGrad);stroke-width:4;stroke-linecap:round;
    stroke-dasharray:113.1;stroke-dashoffset:113.1;
    transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);
  }
  .ring-pct{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:10.5px;font-weight:800;font-family:'Sora',sans-serif;letter-spacing:.2px;
  }
  .p-row-text{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline}
  .p-row .lbl{font-size:13px;font-weight:700;letter-spacing:.1px}
  .p-row .val{
    font-size:13px;font-weight:800;font-family:'Sora',sans-serif;
    background:linear-gradient(135deg,#a78bfa,#67e8f9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .track{height:9px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    box-shadow:0 0 16px rgba(124,92,255,.75);
    transition:width .65s cubic-bezier(.2,.8,.2,1);
  }
  .p-sub{margin-top:9px;font-size:11.5px;color:var(--muted);font-weight:500}

  /* ---------- Mission card ---------- */
  #missions{counter-reset:mission}
  .mission{
    position:relative;
    counter-increment:mission;
    background:var(--card);
    border:1px solid var(--stroke);
    border-left:3px solid color-mix(in srgb, var(--macc1,var(--accent1)) 55%, transparent);
    border-radius:20px;
    padding:14px;
    margin-bottom:14px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
    transition:border-color .35s, box-shadow .35s, background .35s;
  }
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .mission::before{
    content:counter(mission);
    position:absolute;top:-9px;left:16px;z-index:2;
    width:21px;height:21px;border-radius:50%;
    background:var(--macc1,var(--accent1));color:#0c0e1a;
    font:800 11px/21px 'Sora',sans-serif;text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,.4), 0 0 0 3px var(--bg);
  }
  .mission.completed{
    border-color:rgba(34,197,94,.48);
    border-left-color:rgba(34,197,94,.65);
    background:linear-gradient(160deg,rgba(34,197,94,.10),rgba(255,255,255,.03));
    box-shadow:0 10px 28px rgba(34,197,94,.16);
  }
  .mission.completed::before{background:#22c55e;color:#062615}

  /* six distinct accent identities — ad missions read as rounded-square tiles,
     link missions as circular tiles, so the two mission types are legible at a glance */
  .mission:nth-child(1){--macc1:#8b5cf6;--macc2:#c4b5fd}
  .mission:nth-child(2){--macc1:#22d3ee;--macc2:#a5f3fc}
  .mission:nth-child(3){--macc1:#f59e0b;--macc2:#fcd34d}
  .mission:nth-child(4){--macc1:#fb7185;--macc2:#fecdd3}
  .mission:nth-child(5){--macc1:#10b981;--macc2:#6ee7b7}
  .mission:nth-child(6){--macc1:#3b82f6;--macc2:#93c5fd}
  .mission:nth-child(odd) .m-icon{border-radius:14px}
  .mission:nth-child(even) .m-icon{border-radius:50%}

  .m-top{display:flex;align-items:flex-start;gap:12px}
  .m-icon{
    width:46px;height:46px;flex:0 0 46px;border-radius:15px;
    display:grid;place-items:center;font-size:21px;
    background:linear-gradient(150deg, color-mix(in srgb, var(--macc1,var(--accent1)) 26%, transparent), color-mix(in srgb, var(--macc2,var(--accent2)) 10%, transparent));
    border:1px solid color-mix(in srgb, var(--macc1,var(--accent1)) 38%, transparent);
    box-shadow:0 6px 16px color-mix(in srgb, var(--macc1,var(--accent1)) 22%, transparent);
    transition:transform .3s, border-radius .3s;
  }
  .mission.completed .m-icon{transform:scale(1.05)}
  .m-text{flex:1;min-width:0}
  .m-text h3{
    margin:2px 0 0;font-size:14.5px;font-weight:700;line-height:1.32;
    letter-spacing:.1px;font-family:'Sora',sans-serif;
  }
  .m-text p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.4;font-weight:500}
  .m-badge{
    flex:0 0 auto;display:flex;align-items:baseline;
    padding:6px 11px;border-radius:99px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);
    font-size:13px;font-weight:800;font-family:'Sora',sans-serif;
  }
  .m-badge b{color:var(--macc2,#c4b5fd)}
  .m-badge span{font-size:11px;color:var(--muted);font-weight:700;font-family:'Inter',sans-serif}
  .mission.completed .m-badge{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35)}
  .mission.completed .m-badge b{color:#5ee89b}

  .m-track{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:13px}
  .m-fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--macc1,var(--accent1)),var(--macc2,var(--accent2)));
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .mission.completed .m-fill{background:linear-gradient(90deg,#22c55e,#4ade80);box-shadow:0 0 12px rgba(34,197,94,.6)}

  .m-btn{
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    width:100%;height:48px;margin-top:13px;
    border:1px solid transparent;border-radius:14px;
    font-family:'Sora',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2px;
    color:#fff;cursor:pointer;user-select:none;
    background:linear-gradient(135deg,var(--macc1,var(--accent1)),var(--macc2,var(--accent2)));
    box-shadow:0 9px 22px color-mix(in srgb, var(--macc1,var(--accent1)) 34%, transparent);
    transition:transform .15s ease, box-shadow .3s, background .3s, color .3s, border-color .3s;
  }
  .m-btn > span:not(.cd-fill){position:relative;z-index:1}
  .m-btn:active{transform:scale(.972)}
  .m-btn:disabled{cursor:default}
  .m-btn.loading{filter:saturate(.55) brightness(.92)}
  .m-btn.counting{
    background:rgba(255,255,255,.06);
    color:#cfd6ff;box-shadow:none;
    border-color:rgba(255,255,255,.15);
  }
  .m-btn.done{
    background:rgba(34,197,94,.14);
    color:#5ee89b;box-shadow:none;
    border-color:rgba(34,197,94,.36);
  }
  .cd-fill{
    position:absolute;left:0;top:0;bottom:0;width:0;z-index:0;
    background:linear-gradient(90deg, color-mix(in srgb, var(--macc1,var(--accent1)) 55%, transparent), color-mix(in srgb, var(--macc2,var(--accent2)) 55%, transparent));
    pointer-events:none;
  }
  .spinner{
    display:none;width:15px;height:15px;margin-right:9px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
    animation:spin .7s linear infinite;
  }
  .m-btn.loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;z-index:70;
    transform:translate(-50%,22px);opacity:0;
    padding:12px 20px;border-radius:15px;
    background:rgba(18,22,36,.94);
    border:1px solid rgba(255,255,255,.11);
    box-shadow:0 14px 36px rgba(0,0,0,.55);
    font-size:13px;font-weight:700;color:#fff;white-space:nowrap;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:opacity .35s, transform .35s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- Congratulations ---------- */
  .congrats{
    position:fixed;inset:0;z-index:65;
    display:none;place-items:center;padding:26px;
    background:rgba(5,7,14,.74);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  }
  .congrats.show{display:grid;animation:fadeIn .35s ease both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .cg-card{
    position:relative;width:100%;max-width:370px;text-align:center;
    padding:34px 24px 26px;border-radius:28px;
    background:linear-gradient(165deg,rgba(124,92,255,.30),rgba(34,211,238,.10));
    border:1px solid rgba(255,255,255,.17);
    box-shadow:0 34px 80px rgba(0,0,0,.65);
    animation:pop .75s cubic-bezier(.2,1.35,.4,1) both;
  }
  @keyframes pop{
    0%{opacity:0;transform:scale(.55) translateY(36px)}
    60%{transform:scale(1.045)}
    100%{opacity:1;transform:scale(1)}
  }
  .cg-trophy{
    position:relative;width:104px;height:104px;margin:0 auto 18px;
    display:grid;place-items:center;font-size:52px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.20),rgba(124,92,255,.28));
    border:1px solid rgba(255,255,255,.20);
    animation:trophyFloat 2.6s ease-in-out infinite;
  }
  @keyframes trophyFloat{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-8px) scale(1.04)}
  }
  .cg-trophy::before,.cg-trophy::after{
    content:'';position:absolute;inset:-10px;border-radius:50%;
    border:1px solid rgba(167,139,250,.45);
    animation:ring 2.4s ease-out infinite;
  }
  .cg-trophy::after{animation-delay:1.2s}
  @keyframes ring{
    0%{transform:scale(.85);opacity:.85}
    100%{transform:scale(1.5);opacity:0}
  }
  .cg-card h2{
    margin:0 0 10px;font-size:25px;font-weight:900;letter-spacing:.3px;
    font-family:'Sora',sans-serif;
    background:linear-gradient(135deg,#ffffff,#c4b5fd 55%,#67e8f9);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .cg-card p{margin:0 0 20px;font-size:13.5px;line-height:1.6;color:#b9c0d8;font-weight:500}
  .cg-stats{display:flex;gap:10px;margin-bottom:14px}
  .cg-stat{
    flex:1;padding:12px 6px;border-radius:16px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);
  }
  .cg-stat b{display:block;font-size:19px;font-weight:900;color:#fff;font-family:'Sora',sans-serif}
  .cg-stat span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase}

  /* Date / Time row */
  .cg-when{
    display:flex;gap:10px;margin-bottom:22px;
  }
  .cg-when-item{
    flex:1;padding:11px 12px;border-radius:16px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
    text-align:left;
  }
  .cg-when-item .k{
    display:block;font-size:10px;font-weight:800;letter-spacing:.6px;
    text-transform:uppercase;color:var(--muted);margin-bottom:5px;
  }
  .cg-when-item .v{
    display:block;font-size:14px;font-weight:900;color:#fff;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .cg-btn{
    width:100%;height:52px;border:none;border-radius:16px;
    font-family:'Sora',sans-serif;font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 12px 28px rgba(124,92,255,.45);
    cursor:pointer;transition:transform .15s;
  }
  .cg-btn:active{transform:scale(.97)}
  .cg-spark{position:absolute;font-size:18px;opacity:.9;animation:spark 2.2s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-9px) scale(1.2);opacity:1}}

  /* ---------- Confetti ---------- */
  #confetti{position:fixed;inset:0;z-index:80;overflow:hidden;pointer-events:none}
  .confetti-piece{
    position:absolute;top:-24px;display:block;border-radius:2px;
    opacity:0;animation:fall linear forwards;
  }
  @keyframes fall{
    0%{opacity:1;transform:translateY(-24px) rotate(0deg)}
    100%{opacity:0;transform:translateY(110vh) rotate(760deg)}
  }

  .footer{
    text-align:center;margin-top:26px;
    font-size:11px;color:rgba(139,147,171,.6);font-weight:600;letter-spacing:.5px;
  }
</style>
</head>

<div class="app">
  <!-- Header -->
  <header class="topbar">
    <div class="logo">🎯</div>
    <div>
      <h1>Complete 6 Missions</h1>
      <p>Finish every mission to unlock your reward</p>

  <!-- Overall progress -->
  <section class="progress-card">
    <div class="p-row">
      <div class="p-ring">
        <svg viewBox="0 0 44 44">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#67e8f9"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="22" cy="22" r="18"></circle>

    <div class="track"><div class="fill" id="overallFill"></div></div>
    <div class="p-sub" id="overallSub">0 of 6 missions completed</div>

  <!-- Missions -->

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Congratulations -->

    <div class="cg-trophy">🏆</div>
    <h2>Congratulations!</h2>
    <p>You completed all 6 missions successfully.<br>You're a legend! 🎊</p>

    <div class="cg-stats">
      <div class="cg-stat"><b>6/6</b><span>Missions</span></div>
      <div class="cg-stat"><b>36/36</b><span>Points</span></div>
      <div class="cg-stat"><b>100%</b><span>Done</span></div>
    </div>

    <!-- Date & Time when congratulated -->
    <div class="cg-when">
      <div class="cg-when-item">
        <span class="k">📅 Date</span>
        <span class="v" id="cgDate">—</span>
      </div>
      <div class="cg-when-item">
        <span class="k">🕐 Time</span>
        <span class="v" id="cgTime">—</span>
      </div>
    </div>

    <button class="cg-btn" id="cgBtn">Awesome! 🎉</button>
  </div>
</div>

<div id="confetti"></div>

    kind: 'link',
    icon: '🚀',
    title: 'Click The Link & Stay 5 Seconds',
    desc: 'Open the link and stay there for 5 seconds',
    button: 'Click The Link',
    limit: 6,
    url: 'https://omg10.com/4/10686606'
  }
];

const LINK_STAY_SECONDS = 5;

/* =========================================================
   4) State
   ========================================================= */
const state = MISSIONS.map(() => ({ count: 0, busy: false }));
const refs = [];
let congratsShown = false;
let congratsAt = null;   // stores Date when congrats was triggered

/* =========================================================
   5) Helpers
   ========================================================= */
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function haptic(type) {
  if (!tg || !tg.HapticFeedback) return;
  try {
    if (type === 'light') tg.HapticFeedback.impactOccurred('light');
    else if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
  } catch (e) {}
}

function openLink(url) {
  if (!url) return;
  try {
    if (tg && tg.openLink) tg.openLink(url, { try_instant_view: false });
    else window.open(url, '_blank');
  } catch (e) {
    try { window.open(url, '_blank'); } catch (e2) {}
  }
}

async function waitFor(checkFn, tries, delay) {
  tries = tries || 24;
  delay = delay || 200;
  for (let i = 0; i < tries; i++) {
    try { if (checkFn()) return true; } catch (e) {}
    await sleep(delay);
  }
  return false;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
}

/* =========================================================
   6) ADSGRAM  —  Rewarded ad
   ========================================================= */
let adsgramController = null;

function initAdsgram() {
  if (adsgramController) return adsgramController;
  if (window.Adsgram && typeof window.Adsgram.init === 'function') {
    try {
      adsgramController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    } catch (e) {
      adsgramController = null;
    }
  }
  return adsgramController;
}
initAdsgram();

function showAdsgramAd() {
  return new Promise((resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    // if SDK is not available at all, fail fast
    if (!window.Adsgram || typeof window.Adsgram.init !== 'function') {
      done(false); return;
    }

    setTimeout(() => done(false), 45000);

    const ctrl = initAdsgram();
    if (!ctrl || typeof ctrl.show !== 'function') { done(false); return; }

    try {
      if (typeof ctrl.on === 'function') {
        ctrl.on('onReward', () => done(true));
        ctrl.on('onError',  () => done(false));
      }
    } catch (e) {}

    try {
      const p = ctrl.show();
      if (p && typeof p.then === 'function') {
        p.then((result) => {
          if (result && result.done === true) done(true);
          else done(false);
        }).catch(() => done(false));
      } else {
        setTimeout(() => done(false), 35000);
      }
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   7) ADSBITVEX  —  window.showadsbitvex()
   ========================================================= */
function showAdsbitvexAd() {
  return new Promise(async (resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    setTimeout(() => done(false), 90000);

    const ready = await waitFor(
      () => typeof window.showadsbitvex === 'function', 24, 200
    );
    if (!ready) { done(false); return; }

    try {
      window.showadsbitvex()
        .then(() => done(true))
        .catch(() => done(false));
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   8) MONETAG  —  show_10541383()
   ========================================================= */
function showMonetagAd() {
  return new Promise(async (resolve) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };

    setTimeout(() => done(false), 90000);

    const ready = await waitFor(
      () => typeof window.show_10541383 === 'function', 24, 200
    );
    if (!ready) { done(false); return; }

    try {
      window.show_10541383()
        .then(() => done(true))
        .catch(() => done(false));
    } catch (e) {
      done(false);
    }
  });
}

/* =========================================================
   9) Build mission cards
   ========================================================= */
function buildMissions() {
  const wrap = document.getElementById('missions');

  MISSIONS.forEach((m, i) => {
    const card = document.createElement('article');
    card.className = 'mission';
    card.style.animationDelay = (i * 80) + 'ms';

    card.innerHTML = `
      <div class="m-top">
        <div class="m-icon">${m.icon}</div>
        <div class="m-text">
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
        </div>
        <div class="m-badge"><b>0</b><span>/${m.limit}</span></div>
      </div>
      <div class="m-track"><div class="m-fill"></div></div>
      <button class="m-btn" type="button">
        <span class="cd-fill"></span>
        <span class="spinner"></span>
        <span class="btn-label">${m.button}</span>
      </button>
    `;

    const ref = {
      card,
      num:  card.querySelector('.m-badge b'),
      fill: card.querySelector('.m-fill'),
      btn:  card.querySelector('.m-btn'),
      label:card.querySelector('.btn-label'),
      cd:   card.querySelector('.cd-fill')
    };

    ref.btn.addEventListener('click', () => onMissionClick(i));

    refs.push(ref);
    wrap.appendChild(card);
  });
}

/* =========================================================
   10) Click router
   ========================================================= */
function onMissionClick(i) {
  const m = MISSIONS[i];
  const s = state[i];
  if (s.busy || s.count >= m.limit) return;

  if (m.kind === 'ad') runAdMission(i);
  else runLinkMission(i);
}

/* ---------- Ad mission (with Adsgram → Monetag fallback) ---------- */
async function runAdMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');

  r.btn.classList.add('loading');
  r.btn.disabled = true;

  let rewarded = false;

  if (m.provider === 'adsgram') {
    r.label.textContent = 'Loading Adsgram ad…';
    rewarded = await showAdsgramAd();

    // 🔁 Fallback: Adsgram didn't show / didn't load → try Monetag
    if (!rewarded) {
      r.label.textContent = 'Adsgram unavailable — trying Monetag…';
      toast('Adsgram failed — switching to Monetag');
      await sleep(300);
      rewarded = await showMonetagAd();
    }

  } else if (m.provider === 'adsbitvex') {
    r.label.textContent = 'Loading Adsbitbex ad…';
    rewarded = await showAdsbitvexAd();

  } else if (m.provider === 'monetag') {
    r.label.textContent = 'Loading Monetag ad…';
    rewarded = await showMonetagAd();
  }

  r.btn.classList.remove('loading');
  r.btn.disabled = false;
  r.label.textContent = m.button;
  s.busy = false;

  if (rewarded) {
    completeMission(i);
  } else {
    haptic('error');
    toast('Ad not completed — please try again');
  }
}

/* ---------- Link mission (click once → 1 point) ---------- */
function runLinkMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  s.busy = true;
  haptic('light');

  // open the link in Telegram's in-app browser
  if (m.url) openLink(m.url);

  r.btn.classList.add('counting');
  r.btn.disabled = true;

  // progress fill animation
  r.cd.style.transition = 'none';
  r.cd.style.width = '0%';
  void r.cd.offsetWidth;
  r.cd.style.transition = 'width ' + LINK_STAY_SECONDS + 's linear';
  r.cd.style.width = '100%';

  const startTime = Date.now();
  r.label.textContent = 'Stay ' + LINK_STAY_SECONDS + 's…';

  let finished = false;
  let timer = null;

  // 🔒 single-shot finish: prevents double point counting
  const finish = () => {
    if (finished) return;
    finished = true;

    if (timer) clearInterval(timer);
    document.removeEventListener('visibilitychange', onVisible);

    r.btn.classList.remove('counting');
    r.cd.style.transition = 'none';
    r.cd.style.width = '0%';
    r.btn.disabled = false;
    r.label.textContent = m.button;
    s.busy = false;

    completeMission(i);   // ← exactly 1 point
  };

  const onVisible = () => {
    if (document.visibilityState === 'visible' &&
        (Date.now() - startTime) / 1000 >= LINK_STAY_SECONDS) {
      finish();
    }
  };

  timer = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    const left = LINK_STAY_SECONDS - elapsed;

    if (left <= 0) {
      finish();
    } else {
      r.label.textContent = 'Stay ' + Math.ceil(left) + 's…';
    }
  }, 250);

  document.addEventListener('visibilitychange', onVisible);
}

/* =========================================================
   11) Complete / update UI
   ========================================================= */
function completeMission(i) {
  const m = MISSIONS[i];
  const s = state[i];
  const r = refs[i];

  if (s.count >= m.limit) return;

  s.count++;
  haptic('medium');

  r.num.textContent = s.count;
  r.fill.style.width = ((s.count / m.limit) * 100) + '%';

  if (s.count >= m.limit) {
    r.card.classList.add('completed');
    r.btn.disabled = true;
    r.btn.classList.add('done');
    r.label.textContent = 'Completed ✓';
    haptic('success');
    toast('Mission completed! ✅');
  } else {
    toast('+1 point  •  ' + s.count + '/' + m.limit);
  }

  updateOverall();
  checkAllDone();
}

function updateOverall() {
  const total = MISSIONS.reduce((a, m) => a + m.limit, 0);
  const got = state.reduce((a, s) => a + s.count, 0);
  const doneMissions = state.filter((s, i) => s.count >= MISSIONS[i].limit).length;
  const pct = total ? got / total : 0;

  document.getElementById('overallText').textContent = got + ' / ' + total;
  document.getElementById('overallFill').style.width = (pct * 100) + '%';
  document.getElementById('overallSub').textContent =
    doneMissions + ' of ' + MISSIONS.length + ' missions completed';

  const ring = document.getElementById('ringFill');
  if (ring) ring.style.strokeDashoffset = (113.1 * (1 - pct)).toFixed(1);
  const ringPct = document.getElementById('ringPct');
  if (ringPct) ringPct.textContent = Math.round(pct * 100) + '%';
}

function checkAllDone() {
  const allDone = state.every((s, i) => s.count >= MISSIONS[i].limit);
  if (allDone && !congratsShown) {
    congratsShown = true;
    congratsAt = new Date();   // ⏱ capture the moment
    haptic('success');
    setTimeout(showCongrats, 550);
  }
}

/* =========================================================
   12) Congratulations + confetti + date/time stamp
   ========================================================= */
function showCongrats() {
  const when = congratsAt || new Date();

  // date (e.g. 18 Sep 2026)
  const dateStr = when.toLocaleDateString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric'
  });

  // time (e.g. 09:42 PM)
  const timeStr = when.toLocaleTimeString('en-US', {
    hour: '2-digit', minute: '2-digit', hour12: true
  });

  document.getElementById('cgDate').textContent = dateStr;
  document.getElementById('cgTime').textContent = timeStr;

  document.getElementById('congrats').classList.add('show');
  launchConfetti();
}

function launchConfetti() {
  const layer = document.getElementById('confetti');
  const colors = ['#7c5cff', '#22d3ee', '#22c55e', '#f59e0b', '#ef4444', '#ec4899', '#ffffff'];

  for (let i = 0; i < 110; i++) {
    const p = document.createElement('i');
    p.className = 'confetti-piece';
    p.style.left = (Math.random() * 100) + '%';
    p.style.background = colors[(Math.random() * colors.length) | 0];
    p.style.width = (5 + Math.random() * 7) + 'px';
    p.style.height = (9 + Math.random() * 11) + 'px';
    p.style.animationDelay = (Math.random() * 1.8) + 's';
    p.style.animationDuration = (2.4 + Math.random() * 2.2) + 's';
    p.style.borderRadius = Math.random() > 0.6 ? '50%' : '2px';
    layer.appendChild(p);
  }

  setTimeout(() => { layer.innerHTML = ''; }, 6500);
}

document.getElementById('cgBtn').addEventListener('click', () => {
  haptic('light');
  document.getElementById('congrats').classList.remove('show');

  // notify the bot with completion timestamp
  if (tg && tg.sendData) {
    try {
      tg.sendData(JSON.stringify({
        event: 'all_missions_completed',
        at: (congratsAt || new Date()).toISOString()
      }));
    } catch (e) {}
  }
});

/* =========================================================
   13) Boot
   ========================================================= */
buildMissions();
updateOverall();

window.addEventListener('load', () => { initAdsgram(); });
setTimeout(() => { initAdsgram(); }, 1500);
</script>
</body>
