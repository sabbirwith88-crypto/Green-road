<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Telegram Ads WebApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h2>Earn Web App</h2>

  <button onclick="start()">Start</button>

  <div id="status">Ready</div>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- RichInfo Ads SDK -->
  <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>

  <script>
    // Telegram init
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
    }

    // Ads initialize (ONLY ONCE)
    window.TelegramAdsController = new TelegramAdsController();

    window.TelegramAdsController.initialize({
      pubId: "1008310",
      appId: "7019",
      onReady: function () {
        document.getElementById("status").innerText = "Ads Loaded";
      },
      onError: function (err) {
        console.log(err);
        document.getElementById("status").innerText = "Ads Load Failed";
      }
    });

    function start() {
      document.getElementById("status").innerText = "Loading Ad...";

      try {
        if (window.TelegramAdsController) {

          // Try show ad (if supported by SDK)
          if (typeof window.TelegramAdsController.showAd === "function") {
            window.TelegramAdsController.showAd();
          } else {
            console.log("showAd not supported in this SDK version");
          }

          // simulate reward after ad
          setTimeout(() => {
            document.getElementById("status").innerText = "Reward Earned ✔";
          }, 3000);

        }
      } catch (e) {
        console.log(e);
        document.getElementById("status").innerText = "Error showing ad";
      }
    }
  </script>

</body>
</html>
